<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NAAMB - Programa para criação de previsões</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-header">
    <div class="header-namb">
        <img src="NAAMB_LOGO.png" alt="Logo NAAMB" class="logo-namb">
        <div class="titulos">
            <h1>NAAMB</h1>
            <p>Programa para criação de previsões meteorológicas amadoras do NAAMB</p>
        </div>
    </div>
</div>

<div class="main-container">

    <div class="toolbar">      
        <div class="content">
            <div class="tool-group">
                <label>DATA DA PREVISÃO</label>
                <input type="text" id="inputData" placeholder="Ex: 11/04/2026" oninput="desenharTudo()">
            </div>

            <div class="tool-group">
                <label>TIPO DE RISCO</label>
                <select id="mapSelect" onchange="trocarTipoPrevisao(this.value)">
                    <option value="geral">Riscos Gerais</option>
                    <option value="tornado">Tornado</option>
                    <option value="granizo">Granizo</option>
                    <option value="vento">Vento</option>
                    <option value="downburst">Downburst</option> </select>
                </select>
            </div>

            <div id="areaBotaoNA" style="display:none;">
                <button id="btnNA" class="btn na" onclick="ativarNA()">ATIVAR MAPA N/A</button>
            </div>

            <label class="label-set">NÍVEIS DE RISCO</label>
            <div id="areaBotoesRisco"></div>

            <div class="acoes">
                <button class="btn fechar" onclick="fecharPoligono()">PREENCHER ÁREA</button>
                <div class="dupla-botoes">
                    <button class="btn desfazer" onclick="desfazerPonto()">DESFAZER</button>
                    <button class="btn limpar" onclick="limparMapa()">LIMPAR</button>
                </div>
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <div class="save-container">
        <div class="save-buttons">
            <button class="btn save-current" onclick="downloadMapa()">SALVAR PREVISÃO ATUAL</button>
            <button class="btn save-all" onclick="downloadTodas()">SALVAR TODAS</button>
        </div>
    </div>

</div>

    <script src="script.js"></script>
</body>
</html>
